<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="plane-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="plane-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="glass-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Cute Little Cloud at bottom left -->
  <g opacity="0.9" filter="url(#soft-shadow)">
    <path d="M 14 96 A 8 8 0 0 1 26 88 A 12 12 0 0 1 44 88 A 8 8 0 0 1 54 96 A 6 6 0 0 1 50 106 L 18 106 A 6 6 0 0 1 14 96 Z" fill="url(#cloud-grad)" />
  </g>

  <!-- Speed dash puffs -->
  <path d="M 8 72 Q 16 71 22 74" stroke="#FDE047" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 12 60 Q 22 61 28 58" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Whole Airplane Group, tilted -14 deg for energetic climb -->
  <g transform="translate(60, 58) rotate(-14) translate(-60, -58)" filter="url(#soft-shadow)">
    <!-- Back Wing -->
    <path d="M 52 38 L 70 16 C 73 12 78 14 77 19 L 68 40 Z" fill="#0284C7" />
    
    <!-- Vertical Tail Fin -->
    <path d="M 22 46 L 27 25 C 28 21 33 21 34 25 L 36 46 Z" fill="#F43F5E" />
    <!-- Tail fin highlight stripe -->
    <path d="M 28 26 L 33 26 L 34 33 L 29 33 Z" fill="#FFE4E6" opacity="0.9" />

    <!-- Cute Jet Engine Under Wing -->
    <rect x="52" y="66" width="16" height="8" rx="4" fill="#64748B" />
    <ellipse cx="68" cy="70" rx="2" ry="4" fill="#0284C7" />
    <ellipse cx="52" cy="70" rx="2" ry="4" fill="#F59E0B" />

    <!-- Main Fuselage (Chubby Cute Body) -->
    <path d="M 22 56 
             C 22 42, 42 36, 75 38 
             C 98 40, 108 50, 108 58 
             C 108 66, 96 76, 75 78 
             C 42 80, 22 72, 22 56 Z" 
          fill="url(#plane-body)" 
          stroke="#0F172A" 
          stroke-width="2.5" />

    <!-- Cute Nose Cone Highlight (Soft Coral Pink or Golden) -->
    <path d="M 98 45 C 105 49 108 54 108 58 C 108 62 105 67 98 71 Z" fill="#FB7185" />

    <!-- Big Cute Windshield / Cockpit Visor -->
    <path d="M 80 43 
             C 91 43, 98 49, 97 56 
             L 81 56 
             C 80 50, 80 45, 80 43 Z" 
          fill="url(#glass-shine)" 
          stroke="#0F172A" 
          stroke-width="2" />
    <!-- Cute Glass Glimmer -->
    <ellipse cx="88" cy="48" rx="3.5" ry="2" fill="#FFFFFF" transform="rotate(-15 88 48)" opacity="0.9" />
    
    <!-- Cute Round Cabin Windows -->
    <circle cx="68" cy="53" r="3.2" fill="#0284C7" stroke="#0F172A" stroke-width="1.2" />
    <circle cx="56" cy="53" r="3.2" fill="#0284C7" stroke="#0F172A" stroke-width="1.2" />
    <circle cx="44" cy="53" r="3.2" fill="#0284C7" stroke="#0F172A" stroke-width="1.2" />
    <!-- Window glimmers -->
    <circle cx="67" cy="52" r="1" fill="#FFFFFF" />
    <circle cx="55" cy="52" r="1" fill="#FFFFFF" />
    <circle cx="43" cy="52" r="1" fill="#FFFFFF" />

    <!-- Cute Cheek Blush -->
    <ellipse cx="94" cy="62" rx="3" ry="2" fill="#FDA4AF" opacity="0.8" />

    <!-- Front Wing (Chubby & Dynamic) -->
    <path d="M 48 58 
             L 66 84 
             C 68 87, 74 86, 75 82 
             L 76 60 
             Z" 
          fill="url(#plane-wing)" 
          stroke="#0F172A" 
          stroke-width="2.2" />
    <!-- Wing tip accent -->
    <path d="M 64 81 L 70 85 C 73 85 74 83 75 81 L 73 78 Z" fill="#FDE047" />

    <!-- Cute Smiling Mouth on the front nose -->
    <path d="M 101 58 Q 103 62 100 64" stroke="#0F172A" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Cute sparkle stars around the plane -->
  <path d="M 98 22 Q 102 22 102 18 Q 102 22 106 22 Q 102 22 102 26 Q 102 22 98 22 Z" fill="#FACC15" />
  <circle cx="108" cy="30" r="1.5" fill="#FDE047" />
  <circle cx="36" cy="16" r="1.5" fill="#FDE047" />
</svg>
